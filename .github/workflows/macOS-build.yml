name: MacOS build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon
          - runner: macos-15
            arch: arm64
          # Intel (available until Aug 2027, the last x86_64 GitHub-hosted runner)
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install \
            gtkmm3 \
            gtk-mac-integration \
            ninja \
            pkgconf

      # Workaround for now, we create our own features.h file (macos image either is missing this file, or some include folder is missing during the build)
      - name: Add `features.h`
        run: |
          cat >> src/features.h << EOF
          #pragma once
          /*** @file features.h*
          * @brief Synonym for `<sys/cdefs.h>` for source compatibility with glibc.
          * */
          #include <sys/cdefs.h>
          EOF

      - name: Build & package (DMG)
        run: ./scripts/build-macos-prod.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macOS-dmg-package-${{ matrix.arch }}
          path: build_prod_macos/libreweb-browser-v*.dmg
